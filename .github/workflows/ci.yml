name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node – typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install
        env:
          PNPM_ALLOW_BUILD: "esbuild @swc/core msw unrs-resolver"

      - run: pnpm typecheck

      - run: pnpm build

  python:
    name: Python – parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r artifacts/api-server/requirements-dev.txt

      - run: python -m pytest artifacts/api-server/tests -q

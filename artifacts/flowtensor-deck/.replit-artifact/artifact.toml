kind = "slides"
previewPath = "/flowtensor-deck/"
title = "FlowTensor Deck"
version = "1.0.0"
id = "artifacts/flowtensor-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/flowtensor-deck/" ]
localPort = 23579

[services.development]
run = "pnpm --filter @workspace/flowtensor-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flowtensor-deck", "run", "build" ]
publicDir = "artifacts/flowtensor-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23579"
BASE_PATH = "/flowtensor-deck/"

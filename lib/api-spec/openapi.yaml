openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FlowTensor API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: parse
    description: Python code parsing operations
  - name: ai
    description: AI-powered explanations via Groq
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /parse:
    post:
      operationId: parseCode
      tags: [parse]
      summary: Parse Python code into a flow graph
      description: Parses PyTorch or Pandas code using AST analysis and returns nodes and edges representing the data flow graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseRequest"
      responses:
        "200":
          description: Successfully parsed code into a flow graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseResponse"
        "422":
          description: Code could not be parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseError"
  /fetch-repo:
    post:
      operationId: fetchRepo
      tags: [parse]
      summary: Browse a public GitHub repository for Python files
      description: Accepts a GitHub repository URL, fetches repo metadata and recursively lists Python files (up to 3 levels deep).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchRepoRequest"
      responses:
        "200":
          description: Repository browsed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoBrowseResult"
        "422":
          description: Could not browse the repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseError"
  /fetch-file:
    post:
      operationId: fetchFile
      tags: [parse]
      summary: Fetch a single file from a public GitHub repository
      description: Accepts owner, repo, and path, returns the decoded file contents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchFileRequest"
      responses:
        "200":
          description: File fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoFileResult"
        "422":
          description: Could not fetch the file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseError"
  /explain-node:
    post:
      operationId: explainNode
      tags: [ai]
      summary: Generate an AI explanation for a node
      description: Uses Groq (llama3-8b-8192) to produce a context-aware explanation for a specific operation node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainNodeRequest"
      responses:
        "200":
          description: Explanation generated (or static fallback when no key is configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeExplanation"
  /set-groq-key:
    post:
      operationId: setGroqKey
      tags: [ai]
      summary: Save a Groq API key for the current backend session
      description: Stores the user-provided Groq API key in backend memory only (never persisted to disk).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGroqKeyRequest"
      responses:
        "200":
          description: Key saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroqKeyStatus"
  /groq-key-status:
    get:
      operationId: groqKeyStatus
      tags: [ai]
      summary: Check whether a Groq key is currently configured
      responses:
        "200":
          description: Key status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroqKeyStatus"
components:
  schemas:
    ExplainNodeRequest:
      type: object
      properties:
        operation:
          type: string
        parameters:
          type: object
          additionalProperties: true
          nullable: true
        shape_before:
          type: string
          nullable: true
        shape_after:
          type: string
          nullable: true
        variable_name:
          type: string
          nullable: true
        library:
          type: string
          nullable: true
        surrounding_context:
          type: string
          nullable: true
        level:
          type: string
          enum: [beginner, intermediate, pro]
      required:
        - operation
        - level
    NodeExplanation:
      type: object
      properties:
        source:
          type: string
          enum: [ai, static]
          description: "ai = generated by Groq; static = no key configured, caller should fall back to tooltip"
        what:
          type: string
          nullable: true
        impact:
          type: string
          nullable: true
        tip:
          type: string
          nullable: true
        risk:
          type: string
          nullable: true
        cached:
          type: boolean
      required:
        - source
        - cached
    SetGroqKeyRequest:
      type: object
      properties:
        key:
          type: string
      required:
        - key
    GroqKeyStatus:
      type: object
      properties:
        has_key:
          type: boolean
        source:
          type: string
          enum: [user, env, none]
        explanation_count:
          type: integer
      required:
        - has_key
        - source
        - explanation_count
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ParseRequest:
      type: object
      properties:
        code:
          type: string
          description: Python source code to parse (PyTorch or Pandas)
      required:
        - code
    FlowNode:
      type: object
      properties:
        id:
          type: string
          description: Unique node identifier
        type:
          type: string
          enum: [pandas, pytorch, input, output, intermediate]
          description: Category of the node
        label:
          type: string
          description: Short display name for the node (e.g., "dropna()")
        description:
          type: string
          description: Plain-English explanation of what the operation does
        input_shape:
          type: string
          description: Inferred input shape/size (e.g., "1000x5", "[32, 128]")
          nullable: true
        output_shape:
          type: string
          description: Inferred output shape/size (e.g., "800x3", "[32, 64]")
          nullable: true
        position_x:
          type: number
          description: Suggested x position for the node in the graph
        position_y:
          type: number
          description: Suggested y position for the node in the graph
        group:
          type: string
          description: Optional group container name (e.g., class body, loop body) — frontend can render these as React Flow subflows
          nullable: true
      required:
        - id
        - type
        - label
        - description
        - input_shape
        - output_shape
        - position_x
        - position_y
    FlowEdge:
      type: object
      properties:
        id:
          type: string
          description: Unique edge identifier
        source:
          type: string
          description: Source node id
        target:
          type: string
          description: Target node id
      required:
        - id
        - source
        - target
    BlockConnection:
      type: object
      properties:
        to:
          type: string
          description: Target block id
        type:
          type: string
          enum: [calls, passes_data, inherits]
          description: Type of relationship between blocks
        label:
          type: string
          description: Edge label (variable name, method name, or "extends")
      required:
        - to
        - type
        - label
    BlockChild:
      type: object
      description: A method (for class blocks) or body (for function/module blocks). Contains the existing flat node graph for that scope.
      properties:
        id:
          type: string
        type:
          type: string
          enum: [method, function_body]
        name:
          type: string
        op_count:
          type: integer
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/FlowNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/FlowEdge"
      required:
        - id
        - type
        - name
        - op_count
        - nodes
        - edges
    FlowBlock:
      type: object
      description: A Level 1 block — class, top-level function, or module-level main code.
      properties:
        id:
          type: string
        type:
          type: string
          enum: [class, function, module]
        name:
          type: string
        summary:
          type: string
          description: Auto-generated summary line shown under the title
        color:
          type: string
          enum: [blue, purple, green, red]
        category:
          type: string
          enum: [data, model, generic, training, main]
        bases:
          type: array
          items:
            type: string
        attributes:
          type: array
          items:
            type: string
        op_count:
          type: integer
        position_x:
          type: number
        position_y:
          type: number
        children:
          type: array
          items:
            $ref: "#/components/schemas/BlockChild"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/BlockConnection"
      required:
        - id
        - type
        - name
        - summary
        - color
        - category
        - bases
        - attributes
        - op_count
        - position_x
        - position_y
        - children
        - connections
    ParseResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/FlowNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/FlowEdge"
        framework:
          type: string
          enum: [pandas, pytorch, mixed, unknown, numpy, pandas+numpy, pytorch+numpy, mixed+numpy]
          description: Detected framework in the code
        level:
          type: integer
          description: Default visualization level (1 = architecture view)
        blocks:
          type: array
          description: Top-level architecture blocks (classes, functions, main)
          items:
            $ref: "#/components/schemas/FlowBlock"
      required:
        - nodes
        - edges
        - framework
        - level
        - blocks
    FetchRepoRequest:
      type: object
      properties:
        url:
          type: string
          description: A public GitHub repository URL (e.g. github.com/owner/repo)
        github_token:
          type: string
          description: Optional GitHub Personal Access Token to raise the rate limit
          nullable: true
      required:
        - url
    RepoFile:
      type: object
      properties:
        name:
          type: string
          description: Filename without folder path
        path:
          type: string
          description: Path relative to repo root
        size:
          type: integer
          description: File size in bytes
      required:
        - name
        - path
        - size
    RepoInfo:
      type: object
      properties:
        owner:
          type: string
        repo:
          type: string
        name:
          type: string
          description: Repository name as reported by GitHub
        description:
          type: string
          nullable: true
        stars:
          type: integer
        language:
          type: string
          nullable: true
      required:
        - owner
        - repo
        - name
        - description
        - stars
        - language
    RepoBrowseResult:
      type: object
      properties:
        info:
          $ref: "#/components/schemas/RepoInfo"
        files:
          type: array
          items:
            $ref: "#/components/schemas/RepoFile"
      required:
        - info
        - files
    FetchFileRequest:
      type: object
      properties:
        owner:
          type: string
        repo:
          type: string
        path:
          type: string
        github_token:
          type: string
          description: Optional GitHub Personal Access Token to raise the rate limit
          nullable: true
      required:
        - owner
        - repo
        - path
    RepoFileResult:
      type: object
      properties:
        code:
          type: string
        filename:
          type: string
      required:
        - code
        - filename
    ParseError:
      type: object
      properties:
        error:
          type: string
          description: Human-friendly error message
        detail:
          type: string
          description: Technical detail about the parse failure
          nullable: true
      required:
        - error
        - detail
